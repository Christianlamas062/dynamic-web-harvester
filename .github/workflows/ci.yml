name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Test Suite & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Install Playwright Chromium with system dependencies
        run: |
          playwright install --with-deps chromium

      - name: Execute unit testing suite with Pytest
        run: |
          pytest -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Verify CLI Entrypoint Help
        run: |
          python main.py --help
