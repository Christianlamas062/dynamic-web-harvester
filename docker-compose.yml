services:
  harvester:
    build: .
    volumes:
      # Mapea los resultados procesados a una carpeta local de la máquina
      - ./data/processed:/app/data/processed
    environment:
      - PYTHONUNBUFFERED=1
    # Para cambiar parámetros sin reconstruir la imagen:
    command: ["--max-pages", "5", "--format", "excel", "--output-dir", "data/processed"]
